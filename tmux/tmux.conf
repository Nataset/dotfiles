set -g prefix C-a
unbind C-b

setw -g mode-keys vi

set -g default-terminal "xterm-256color"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s escape-time 0

# set-hook -g pane-focus-out 'select-pane -P "bg=default,fg=white"'
# set-hook -g pane-focus-in 'select-pane -P "bg=colour236,fg=default"'

# open new pane, window in the same dir
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# change pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# change pane size
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Space last-window
bind b switch-client -l

# Set status bar refresh rate
set -g status-interval 5

# Status bar colors (Gruvbox Dark)
set -g status-bg colour235
set -g status-fg colour223
set -g status-left-length 40
set -g status-right-length 80

# Left side: Session name + Window list
set -g status-left "#[bg=colour214,fg=colour235,bold] #S #[bg=colour235,fg=colour214]"

# Window list styling (No yellow on selected window)
setw -g window-status-format " #[fg=colour223]#I:#W "
setw -g window-status-current-format "#[bg=colour240,fg=colour223,bold] #I:#W #[bg=colour235,fg=colour240]"

# Right side: Time
set -g status-right "#[fg=colour214]  %Y-%m-%d %H:%M "

# Active pane indicator
set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=colour214

# Window title color
setw -g window-status-separator ""
setw -g window-status-style fg=colour223,bg=colour235
setw -g window-status-current-style fg=colour223,bg=colour240,bold

# Message / command mode colors
set -g message-style fg=colour223,bg=colour136
set -g message-command-style fg=colour223,bg=colour136

# Copy mode colors
set -g mode-style bg=colour214,fg=colour235,bold
